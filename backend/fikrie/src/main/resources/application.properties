spring.application.name=WarehouseInventoryManager

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.url.=jdbc:mysql://localhost:3306/WarehouseInventoryManager?createDatabaseIfNotExist=true
##spring.datasource.username=root
##spring.datasource.password=Sheila8886

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/WarehouseInventoryManager?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Sheila8886}

spring.sql.init.mode=always
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

#spring.security.user.name=admin
#spring.security.user.password=Sheila8886

spring.jpa.defer-datasource-initialization=true
logging.level.root=DEBUG
logging.level.org.springframework.security=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.admin.email=${ADMIN_EMAIL:admin@gmail.com}
spring.admin.password=${ADMIN_PASSWORD:@dmin}

jwt.secret-key=${WAREHOUSE_JWT_SECRET}:NONE}