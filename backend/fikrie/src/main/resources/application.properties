spring.application.name=WarehouseInventoryManager

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/WarehouseInventoryManager?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Sheila8886}

spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

logging.level.root=DEBUG
logging.level.org.springframework.security=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#Put any other custom variable that's taking data from docker-compose under this section

#In Spring Boot, an unquoted @ symbol at the start of a property value (like @dmin) is treated as a YAML/Property Reference placeholder rather than plain text
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}
app.admin.password=${ADMIN_PASSWORD:Admin54321}
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
app.jwt.secret-key=${WAREHOUSE_JWT_SECRET:NONE}